<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 40px; }
        img { display: block; max-width: 100%; height: auto; }
        #status { font-family: sans-serif; font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body>
    <div id="status">Rendering...</div>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        const rawChem = params.get('c');
        const id = params.get('id');
        const hash = params.get('hash');

        if (rawChem) {
            const decoded = decodeURIComponent(rawChem);
            
            // Step 1: Strip chemfig wrapper for cloud renderers
            const chemMatch = decoded.match(/\\chemfig\s*\{([^}]+)\}/);
            const formula = chemMatch ? chemMatch[1] : decoded;

            // Step 2: Use cloud bridge (CodeCogs)
            // We use svg.image primarily, then gif.latex/png as fallback
            const svgUrl = `https://latex.codecogs.com/svg.image?\\inline&space;\\bg_white&space;\\usepackage{chemfig}&space;${encodeURIComponent(decoded)}`;
            const pngUrl = `https://latex.codecogs.com/png.latex?\\inline&space;\\bg_white&space;\\usepackage{chemfig}&space;${encodeURIComponent(decoded)}`;
            
            const img = new Image();
            img.onload = () => {
                document.getElementById('status').style.display = 'none';
                document.body.appendChild(img);
                
                // Fetch the actual SVG content if using svgUrl
                if (img.src.includes('svg.image')) {
                    fetch(img.src)
                        .then(r => r.text())
                        .then(svg => {
                            window.parent.postMessage({
                                type: 'resize-chemfig',
                                id: id,
                                hash: hash,
                                svgContent: svg
                            }, '*');
                        })
                        .catch(() => {
                            window.parent.postMessage({
                                type: 'resize-chemfig',
                                id: id,
                                hash: hash,
                                svgContent: img.outerHTML
                            }, '*');
                        });
                } else {
                    window.parent.postMessage({
                        type: 'resize-chemfig',
                        id: id,
                        hash: hash,
                        svgContent: img.outerHTML
                    }, '*');
                }
            };
 
            img.onerror = () => {
                if (img.src === svgUrl) {
                    console.log("SVG render failed, trying PNG...");
                    img.src = pngUrl;
                } else {
                    // Both failed, signal the parent to use the mhchem fallback
                    window.parent.postMessage({
                        type: 'resize-chemfig',
                        id: id,
                        hash: hash,
                        failed: true,
                        rawChem: decoded
                    }, '*');
                    document.getElementById('status').innerText = 'Rendering...';
                }
            };
 
            img.src = svgUrl;
        }

        // Timeout fallback
        setTimeout(() => {
            if (!document.querySelector('img')) {
                window.parent.postMessage({
                    type: 'resize-chemfig',
                    id: id,
                    hash: hash,
                    slow: true,
                    rawChem: rawChem
                }, '*');
            }
        }, 3000);
    </script>
</body>
</html>
