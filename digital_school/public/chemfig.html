<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 40px; }
        img { display: block; max-width: 100%; height: auto; }
        #status { font-family: sans-serif; font-size: 10px; color: #94a3b8; }
    </style>
</head>
<body>
    <div id="status">Rendering...</div>
    
    <script>
        const params = new URLSearchParams(window.location.search);
        const rawChem = params.get('c');
        const id = params.get('id');
        const hash = params.get('hash');

        if (rawChem) {
            const decoded = decodeURIComponent(rawChem);
            
            // Ensure the command is properly wrapped for the renderer
            let latex = decoded;
            if (!latex.includes('\\chemfig') && !latex.includes('\\tikz')) {
                latex = `\\chemfig{${latex}}`;
            }

            // Step 2: Use cloud bridge
            // QuickChart is more reliable for complex packages like chemfig
            // Note: We use \bg_white and \usepackage{chemfig} for high fidelity
            const preamble = `\\usepackage{chemfig}\\usepackage{amsmath}`;
            const fullLatex = `${preamble}\\bg_white ${latex}`;
            
            const quickChartUrl = `https://quickchart.io/latex?formula=${encodeURIComponent(fullLatex)}`;
            const codecogsUrl = `https://latex.codecogs.com/svg.image?${encodeURIComponent(`\\inline ${fullLatex}`)}`;
            const pngUrl = `https://latex.codecogs.com/png.latex?${encodeURIComponent(`\\inline ${fullLatex}`)}`;
            
            const img = new Image();
            img.onload = () => {
                document.getElementById('status').style.display = 'none';
                document.body.appendChild(img);
                
                // Fetch the actual SVG content if using svg/quickchart for better quality and print fidelity
                if (img.src.includes('svg.image') || img.src.includes('quickchart.io')) {
                    fetch(img.src)
                        .then(r => r.text())
                        .then(svg => {
                            if (svg.includes('<svg') || svg.includes('<?xml')) {
                                window.parent.postMessage({
                                    type: 'resize-chemfig',
                                    id: id,
                                    hash: hash,
                                    svgContent: svg
                                }, '*');
                            } else {
                                throw new Error('Not an SVG');
                            }
                        })
                        .catch(() => {
                            // Fallback to the image element itself if fetch fails
                            window.parent.postMessage({
                                type: 'resize-chemfig',
                                id: id,
                                hash: hash,
                                svgContent: img.outerHTML
                            }, '*');
                        });
                } else {
                    window.parent.postMessage({
                        type: 'resize-chemfig',
                        id: id,
                        hash: hash,
                        svgContent: img.outerHTML
                    }, '*');
                }
            };
 
            img.onerror = () => {
                if (img.src === quickChartUrl) {
                    console.warn("QuickChart failed, trying CodeCogs SVG...");
                    img.src = codecogsUrl;
                } else if (img.src === codecogsUrl) {
                    console.warn("CodeCogs SVG failed, trying PNG...");
                    img.src = pngUrl;
                } else {
                    // All cloud options failed, signal parent to use mhchem fallback
                    window.parent.postMessage({
                        type: 'resize-chemfig',
                        id: id,
                        hash: hash,
                        failed: true,
                        rawChem: decoded
                    }, '*');
                }
            };
 
            // Start the chain
            img.src = quickChartUrl;
        }

        // Timeout fallback
        setTimeout(() => {
            if (!document.querySelector('img')) {
                window.parent.postMessage({
                    type: 'resize-chemfig',
                    id: id,
                    hash: hash,
                    slow: true,
                    rawChem: rawChem
                }, '*');
            }
        }, 3000);
    </script>
</body>
</html>
